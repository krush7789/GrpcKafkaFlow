syntax = "proto3";

package auth;

// Owned by auth-service (port 50051). Called by: gateway.
service AuthService {
  rpc SignUp (SignUpRequest) returns (AuthResponse);
  rpc Login (LoginRequest) returns (AuthResponse);
  rpc ValidateToken (ValidateTokenRequest) returns (ValidateTokenResponse);
}

message SignUpRequest {
  string name = 1;
  string email = 2;
  string password = 3;
  // Added later as a NEW field number: old clients that don't send it keep working.
  // Same key on a retry -> auth returns the original result instead of "email already registered".
  string idempotency_key = 4;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message AuthResponse {
  string user_id = 1;
  string token = 2;
}

message ValidateTokenRequest {
  string token = 1;
}

message ValidateTokenResponse {
  bool valid = 1;
  string user_id = 2;
  string email = 3;
}
