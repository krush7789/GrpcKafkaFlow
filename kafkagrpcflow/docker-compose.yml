# Infrastructure only. The Node apps run on your machine (npm run dev).
# `docker compose up -d --wait` returns only once every DB accepts connections.
x-pg-health: &pg-health
  test: ["CMD", "pg_isready", "-h", "localhost", "-U", "postgres"]
  interval: 2s
  retries: 30

services:
  # One Kafka broker in KRaft mode (no Zookeeper needed).
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT = for apps on your machine (localhost:9092)
      # INTERNAL  = for other containers (kafka-ui) -> kafka:29092
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

  # Web UI to SEE topics and messages: http://localhost:8080
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka

  # Database-per-service: each service owns its own Postgres. Nobody reads another service's DB.
  auth-db:
    image: postgres:16-alpine
    ports: ["5433:5432"]
    environment: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: auth_db }
    healthcheck: *pg-health

  profile-db:
    image: postgres:16-alpine
    ports: ["5434:5432"]
    environment: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: profile_db }
    healthcheck: *pg-health

  interaction-db:
    image: postgres:16-alpine
    ports: ["5435:5432"]
    environment: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: interaction_db }
    healthcheck: *pg-health
